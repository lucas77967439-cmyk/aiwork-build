name: Build scrcpy-server 1.24-ws0
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform 31
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager -type f | head -1)
          echo "SDKMGR=$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-31" "build-tools;31.0.0"
      - name: Set local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > scrcpy/local.properties
      - name: Gradle build server
        run: cd scrcpy && chmod +x gradlew && ./gradlew :server:assembleRelease --stacktrace
      - name: Rename apk to jar
        run: |
          APK=$(find scrcpy/server/build -type f -name '*.apk' | head -1)
          echo "APK=$APK"
          cp "$APK" scrcpy-server.jar
          ls -la scrcpy-server.jar
      - uses: actions/upload-artifact@v4
        with:
          name: scrcpy-server-124-ws0
          path: scrcpy-server.jar
          retention-days: 30
