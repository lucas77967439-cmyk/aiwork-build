name: Build scrcpy-server 1.24-ws0
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform 31
        run: |
          SDKMGR=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager -type f | head -1)
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-31" "build-tools;31.0.0"
      - name: Setup JDK 11 (for Gradle 7.0.2)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Set local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > scrcpy/local.properties
      - name: Gradle build server
        run: cd scrcpy && chmod +x gradlew && ./gradlew :server:assembleRelease --stacktrace
      - name: Commit jar as base64 to repo
        run: |
          APK=$(find scrcpy/server/build -type f -name '*.apk' | head -1)
          echo "APK=$APK"
          base64 -w0 "$APK" > built-jar.txt
          wc -c built-jar.txt
          git config user.email "build@local"
          git config user.name "build"
          git add built-jar.txt
          git commit -m "built scrcpy-server 1.24-ws0 jar (base64)"
          git push
